[package]
# "." is not allowed in crate names, but we want a friendlier name for the
# directory and spec file, so we override it below.
name = "kubernetes-1_31"
version = "0.1.0"
edition = "2021"
publish = false
build = "../build.rs"

[lib]
path = "../packages.rs"

[package.metadata.build-package]
package-name = "kubernetes-1.31"

[[package.metadata.build-package.external-files]]
url = "https://distro.eks.amazonaws.com/kubernetes-1-31/releases/50/artifacts/kubernetes/v1.31.14/kubernetes-src.tar.gz"
sha512 = "fbb62ce62367b3936eeb4ba57cc11b41422dd100c640d5d7b1aaf485d4cc8b4f3281130ccef6d243c96473ac9812c370bfb5cf610289c5b6d1b4ff794485f968"

[build-dependencies]
glibc = { path = "../glibc" }
