[package]
# "." is not allowed in crate names, but we want a friendlier name for the
# directory and spec file, so we override it below.
name = "kubernetes-1_31"
version = "0.1.0"
edition = "2021"
publish = false
build = "../build.rs"

[lib]
path = "../packages.rs"

[package.metadata.build-package]
package-name = "kubernetes-1.31"

[[package.metadata.build-package.external-files]]
url = "https://distro.eks.amazonaws.com/kubernetes-1-31/releases/51/artifacts/kubernetes/v1.31.14/kubernetes-src.tar.gz"
sha512 = "0ae277d11262f716b7963a276f07a79f5a04624bba5ca8286f40c6785fce4eabd24b6fa5b43cf222c64aa7b4d96270075c9a145050f66d2d0299171129407acf"

[build-dependencies]
glibc = { path = "../glibc" }
