[package]
# "." is not allowed in crate names, but we want a friendlier name for the
# directory and spec file, so we override it below.
name = "kubernetes-1_31"
version = "0.1.0"
edition = "2021"
publish = false
build = "../build.rs"

[lib]
path = "../packages.rs"

[package.metadata.build-package]
package-name = "kubernetes-1.31"

[[package.metadata.build-package.external-files]]
url = "https://distro.eks.amazonaws.com/kubernetes-1-31/releases/48/artifacts/kubernetes/v1.31.14/kubernetes-src.tar.gz"
sha512 = "65beac2fbb0da7ae1c772b68bfb2fa2fae89605d1de1a9fbb9b7d0f98f5e327bece4279be5050c08bc69ddfdf185929879cc5ac4c570baf83de76f570e2ceb31"

[build-dependencies]
glibc = { path = "../glibc" }
