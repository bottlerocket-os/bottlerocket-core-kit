[package]
# "." is not allowed in crate names, but we want a friendlier name for the
# directory and spec file, so we override it below.
name = "kubernetes-1_31"
version = "0.1.0"
edition = "2021"
publish = false
build = "../build.rs"

[lib]
path = "../packages.rs"

[package.metadata.build-package]
package-name = "kubernetes-1.31"

[[package.metadata.build-package.external-files]]
url = "https://distro.eks.amazonaws.com/kubernetes-1-31/releases/36/artifacts/kubernetes/v1.31.13/kubernetes-src.tar.gz"
sha512 = "1710338f0f0438dbe29cf2e87f1101ba55d276d89062beee7ce1cc3caca8f7cf24bd2ea8ec2f57915fa0690faa7a970425bbb5fb6ac106313cca4f4d6dcb1db9"

[build-dependencies]
glibc = { path = "../glibc" }
