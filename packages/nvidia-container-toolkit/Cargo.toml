[package]
name = "nvidia-container-toolkit"
version = "0.1.0"
edition = "2021"
publish = false
build = "../build.rs"

[lib]
path = "../packages.rs"

[package.metadata.build-package]
releases-url = "https://github.com/NVIDIA/nvidia-container-toolkit/releases"

# Should match the version of the libnvidia-container package
[[package.metadata.build-package.external-files]]
url = "https://github.com/NVIDIA/nvidia-container-toolkit/archive/v1.20.1/nvidia-container-toolkit-1.20.1.tar.gz"
sha512 = "91e4c99a26d1da0ad63f4d7461f02032b43652212029410125a4f35bad7b330075741d5336e031804f7d394258e90bc84a4782fc6956d73f11304abaf6bd990a"

[build-dependencies]
glibc = { path = "../glibc" }
libnvidia-container = { path = "../libnvidia-container" }
