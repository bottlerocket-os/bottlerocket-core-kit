[package]
# "." is not allowed in crate names, but we want a friendlier name for the
# directory and spec file, so we override it below.
name = "ecr-credential-provider-1_36"
version = "0.1.0"
edition = "2021"
publish = false
build = "../build.rs"

[lib]
path = "../packages.rs"

[package.metadata.build-package]
package-name = "ecr-credential-provider-1.36"
releases-url = "https://github.com/kubernetes/cloud-provider-aws/releases"

[[package.metadata.build-package.external-files]]
url = "https://github.com/kubernetes/cloud-provider-aws/archive/refs/tags/v1.36.1.tar.gz"
sha512 = "4a1a5f1d4b2c29f7afbfb4ca1f88470d212068bcd2ec2a2a4f9a044023b646e5b63dc319407a3f84987b52cabdcadac016d04629b5cac39abb9ebf0c9c7b834b"
path = "cloud-provider-aws-1.36.1.tar.gz"
bundle-modules = [ "go" ]

[build-dependencies]
glibc = { path = "../glibc" }
