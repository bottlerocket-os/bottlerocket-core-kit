[package]
# "." is not allowed in crate names, but we want a friendlier name for the
# directory and spec file, so we override it below.
name = "kubernetes-1_35"
version = "0.1.0"
edition = "2021"
publish = false
build = "../build.rs"

[lib]
path = "../packages.rs"

[package.metadata.build-package]
package-name = "kubernetes-1.35"

[[package.metadata.build-package.external-files]]
url = "https://distro.eks.amazonaws.com/kubernetes-1-35/releases/16/artifacts/kubernetes/v1.35.9/kubernetes-src.tar.gz"
sha512 = "f74a71fa49ffae8787f34143922f96067290aea3fab7cf511ae88501662a7cb68986565d61349a696f8804741c53d1f317b3b1195dd3ea269ab5366a38db1744"

[build-dependencies]
glibc = { path = "../glibc" }
