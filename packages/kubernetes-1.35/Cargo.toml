[package]
# "." is not allowed in crate names, but we want a friendlier name for the
# directory and spec file, so we override it below.
name = "kubernetes-1_35"
version = "0.1.0"
edition = "2021"
publish = false
build = "../build.rs"

[lib]
path = "../packages.rs"

[package.metadata.build-package]
package-name = "kubernetes-1.35"

[[package.metadata.build-package.external-files]]
url = "https://distro.eks.amazonaws.com/kubernetes-1-35/releases/13/artifacts/kubernetes/v1.35.6/kubernetes-src.tar.gz"
sha512 = "413a280665fd48557d51db6c41b96f767c7e3db0422455d2d87a89e8435747c17026ec3309e9e80851a898738d3cb742bf15c1306c1253eff48e4595be9e1ced"

[build-dependencies]
glibc = { path = "../glibc" }
