[package]
# "." is not allowed in crate names, but we want a friendlier name for the
# directory and spec file, so we override it below.
name = "kubernetes-1_35"
version = "0.1.0"
edition = "2021"
publish = false
build = "../build.rs"

[lib]
path = "../packages.rs"

[package.metadata.build-package]
package-name = "kubernetes-1.35"

[[package.metadata.build-package.external-files]]
url = "https://distro.eks.amazonaws.com/kubernetes-1-35/releases/15/artifacts/kubernetes/v1.35.8/kubernetes-src.tar.gz"
sha512 = "63e4544c4684156f94bfa04959c698ebfed72ece803be67a76e19c0b376a80fd035e8acb0f935359f424ca4cfdfd973738215f96e21e45966ddc60bf4fbb672d"

[build-dependencies]
glibc = { path = "../glibc" }
