[package]
# "." is not allowed in crate names, but we want a friendlier name for the
# directory and spec file, so we override it below.
name = "kubernetes-1_36"
version = "0.1.0"
edition = "2021"
publish = false
build = "../build.rs"

[lib]
path = "../packages.rs"

[package.metadata.build-package]
package-name = "kubernetes-1.36"

[[package.metadata.build-package.external-files]]
url = "https://distro.eks.amazonaws.com/kubernetes-1-36/releases/10/artifacts/kubernetes/v1.36.5/kubernetes-src.tar.gz"
sha512 = "91c8a513f146aee259d71f2dfc6450ed41d49e2f3b73c349c6816a634aba3d860f6ed1e213b3fef7140e9b6eb64e0ac33c224eefcc2b4d1ceb3a9408b8ef30b2"

[build-dependencies]
glibc = { path = "../glibc" }
