[package]
# "." is not allowed in crate names, but we want a friendlier name for the
# directory and spec file, so we override it below.
name = "kubernetes-1_36"
version = "0.1.0"
edition = "2021"
publish = false
build = "../build.rs"

[lib]
path = "../packages.rs"

[package.metadata.build-package]
package-name = "kubernetes-1.36"

[[package.metadata.build-package.external-files]]
url = "https://distro.eks.amazonaws.com/kubernetes-1-36/releases/7/artifacts/kubernetes/v1.36.2/kubernetes-src.tar.gz"
sha512 = "1b809f4a04ace2908f42bc521b09680a78b360217ab1a086c37461e8496bb6e9c34d45d4c7463ee279767e2190da9ef9f692554824e717ed461c07ea46bf34df"

[build-dependencies]
glibc = { path = "../glibc" }
