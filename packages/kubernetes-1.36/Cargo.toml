[package]
# "." is not allowed in crate names, but we want a friendlier name for the
# directory and spec file, so we override it below.
name = "kubernetes-1_36"
version = "0.1.0"
edition = "2021"
publish = false
build = "../build.rs"

[lib]
path = "../packages.rs"

[package.metadata.build-package]
package-name = "kubernetes-1.36"

[[package.metadata.build-package.external-files]]
url = "https://distro.eks.amazonaws.com/kubernetes-1-36/releases/9/artifacts/kubernetes/v1.36.4/kubernetes-src.tar.gz"
sha512 = "8b0ad6a177a173f56b8384a2f5e8eb183e14112907afdd0abcaabd52f05df9ef696eab6089fe15ff4d96834ad847a77ff968aa526292418f8d189bfd094b1229"

[build-dependencies]
glibc = { path = "../glibc" }
