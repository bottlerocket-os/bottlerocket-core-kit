[package]
# "." is not allowed in crate names, but we want a friendlier name for the
# directory and spec file, so we override it below.
name = "ecr-credential-provider-1_37"
version = "0.1.0"
edition = "2021"
publish = false
build = "../build.rs"

[lib]
path = "../packages.rs"

[package.metadata.build-package]
package-name = "ecr-credential-provider-1.37"
releases-url = "https://github.com/kubernetes/cloud-provider-aws/releases"

[[package.metadata.build-package.external-files]]
url = "https://github.com/kubernetes/cloud-provider-aws/archive/refs/tags/v1.37.0.tar.gz"
sha512 = "920d83a1773788849bfa5e680f084d46b26c76526c01f3edf6c3ca18d2774244c1011531e5fe154f2acc90e1d53aae03ad6bccc2f4d1ef356f1df1879f212bef"
path = "cloud-provider-aws-1.37.0.tar.gz"
bundle-modules = [ "go" ]

[build-dependencies]
glibc = { path = "../glibc" }
