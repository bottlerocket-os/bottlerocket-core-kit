[package]
# "." is not allowed in crate names, but we want a friendlier name for the
# directory and spec file, so we override it below.
name = "kubernetes-1_29"
version = "0.1.0"
edition = "2021"
publish = false
build = "../build.rs"

[lib]
path = "../packages.rs"

[package.metadata.build-package]
package-name = "kubernetes-1.29"

[[package.metadata.build-package.external-files]]
url = "https://distro.eks.amazonaws.com/kubernetes-1-29/releases/54/artifacts/kubernetes/v1.29.15/kubernetes-src.tar.gz"
sha512 = "9c8ab355de561f6e8d6d4af2a3261c261054550c3aaeab5280d0f5ea78b587fe004adb02ecfd0ed34be8c17d537bfabbbb1a5105fb92491f98f19c2820513504"

[build-dependencies]
glibc = { path = "../glibc" }
