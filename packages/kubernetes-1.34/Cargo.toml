[package]
# "." is not allowed in crate names, but we want a friendlier name for the
# directory and spec file, so we override it below.
name = "kubernetes-1_34"
version = "0.1.0"
edition = "2021"
publish = false
build = "../build.rs"

[lib]
path = "../packages.rs"

[package.metadata.build-package]
package-name = "kubernetes-1.34"

[[package.metadata.build-package.external-files]]
url = "https://distro.eks.amazonaws.com/kubernetes-1-34/releases/21/artifacts/kubernetes/v1.34.9/kubernetes-src.tar.gz"
sha512 = "13c7423addfd5d4a3534ae1eab87c4e54c6c6c7a873a14e3abe0614ae22c68a64185354eea6650331804aac0153e908d60839399ba9074d746b8b9140439ec12"

[build-dependencies]
glibc = { path = "../glibc" }
