[package]
# "." is not allowed in crate names, but we want a friendlier name for the
# directory and spec file, so we override it below.
name = "kubernetes-1_34"
version = "0.1.0"
edition = "2021"
publish = false
build = "../build.rs"

[lib]
path = "../packages.rs"

[package.metadata.build-package]
package-name = "kubernetes-1.34"

[[package.metadata.build-package.external-files]]
url = "https://distro.eks.amazonaws.com/kubernetes-1-34/releases/10/artifacts/kubernetes/v1.34.1/kubernetes-src.tar.gz"
sha512 = "fd7f765ce58bdc38c8fe87c66c81badde88d28c8556681ea6eb07732ae20434d1d93bffebf8fbcd6b1c40dacdbe22f6184121fbd93e4524e6c85f84e5acf5e5d"

[build-dependencies]
glibc = { path = "../glibc" }
