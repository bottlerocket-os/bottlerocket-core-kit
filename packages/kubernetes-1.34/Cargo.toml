[package]
# "." is not allowed in crate names, but we want a friendlier name for the
# directory and spec file, so we override it below.
name = "kubernetes-1_34"
version = "0.1.0"
edition = "2021"
publish = false
build = "../build.rs"

[lib]
path = "../packages.rs"

[package.metadata.build-package]
package-name = "kubernetes-1.34"

[[package.metadata.build-package.external-files]]
url = "https://distro.eks.amazonaws.com/kubernetes-1-34/releases/25/artifacts/kubernetes/v1.34.12/kubernetes-src.tar.gz"
sha512 = "048e0ae3cb5a28bc78bcf711888f13780404932fe678db73fd3fe1dced25ac1d1125c98a4fec3ead6e89ececa4b1ce8150a985ce51259e8db9025b4b79b96094"

[build-dependencies]
glibc = { path = "../glibc" }
