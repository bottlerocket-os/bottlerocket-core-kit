[package]
# "." is not allowed in crate names, but we want a friendlier name for the
# directory and spec file, so we override it below.
name = "kubernetes-1_34"
version = "0.1.0"
edition = "2021"
publish = false
build = "../build.rs"

[lib]
path = "../packages.rs"

[package.metadata.build-package]
package-name = "kubernetes-1.34"

[[package.metadata.build-package.external-files]]
url = "https://distro.eks.amazonaws.com/kubernetes-1-34/releases/24/artifacts/kubernetes/v1.34.11/kubernetes-src.tar.gz"
sha512 = "3630c951af35fdd98856e75328cb97852c58459c688d0f45d45e60d23c1c59d1101605b97f5b54db3bb83c0fc60b7a23c1182826f606b42eb08a89f84048c5df"

[build-dependencies]
glibc = { path = "../glibc" }
