[package]
# "." is not allowed in crate names, but we want a friendlier name for the
# directory and spec file, so we override it below.
name = "kubernetes-1_28"
version = "0.1.0"
edition = "2021"
publish = false
build = "../build.rs"

[lib]
path = "../packages.rs"

[package.metadata.build-package]
package-name = "kubernetes-1.28"

[[package.metadata.build-package.external-files]]
url = "https://distro.eks.amazonaws.com/kubernetes-1-28/releases/65/artifacts/kubernetes/v1.28.15/kubernetes-src.tar.gz"
sha512 = "3448b1bda4c018360c4353c8020cfd0f84e70443e580ae2f4ea67d2431f8f6e9468fb94dec17e424eace1b64caa1748e652678ac378b754bbb790dd2358dda15"

[build-dependencies]
glibc = { path = "../glibc" }
