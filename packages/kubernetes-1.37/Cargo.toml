[package]
# "." is not allowed in crate names, but we want a friendlier name for the
# directory and spec file, so we override it below.
name = "kubernetes-1_37"
version = "0.1.0"
edition = "2021"
publish = false
build = "../build.rs"

[lib]
path = "../packages.rs"

[package.metadata.build-package]
package-name = "kubernetes-1.37"

[[package.metadata.build-package.external-files]]
url = "https://distro.eks.amazonaws.com/kubernetes-1-37/releases/4/artifacts/kubernetes/v1.37.1/kubernetes-src.tar.gz"
sha512 = "c71bb2c415095290bb3b95a8638d34762f1b4795d4b5195b7299640a45faa921e39f38cd61d8bee9ea4b501677eb1ed4af13874d2310c54ba4a39affbd24842a"

[build-dependencies]
glibc = { path = "../glibc" }
