# There is no interactive user at the the console, so the defaults below
# aim for "boot straight through, expose nothing extra, keep exactly
# one local recovery path."
#
# Note that this file is measured into TPM PCR 5 before parsing: editing
# it changes PCR 5 and invalidates anything sealed against it.

# Boot the default entry immediately, with no menu delay.
timeout menu-disabled

# Leave the firmware-selected console text mode alone.
console-mode keep

# Disable the interactive kernel command line editor.
editor no

# Do not synthesize "other OS" menu entries.
auto-entries no

# Drop the "Reboot Into Firmware Interface" menu entry.
auto-firmware no

# No "Power Off"/"Reboot The System" menu entries.
auto-poweroff no
auto-reboot no

# No PC-speaker beeping during the countdown.
beep no

# Never scan /loader/keys or enroll Secure Boot keys from the ESP.
secure-boot-enroll off
