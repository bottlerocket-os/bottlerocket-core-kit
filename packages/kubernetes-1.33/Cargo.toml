[package]
# "." is not allowed in crate names, but we want a friendlier name for the
# directory and spec file, so we override it below.
name = "kubernetes-1_33"
version = "0.1.0"
edition = "2021"
publish = false
build = "../build.rs"

[lib]
path = "../packages.rs"

[package.metadata.build-package]
package-name = "kubernetes-1.33"

[[package.metadata.build-package.external-files]]
url = "https://distro.eks.amazonaws.com/kubernetes-1-33/releases/19/artifacts/kubernetes/v1.33.5/kubernetes-src.tar.gz"
sha512 = "30c54c71baacaf30db721d26cc5eacbb7fd8a8c0ea2226c00fdf7f02ee3d9e89cff42be230e7b4a7e8cd43aa5ef7cb15b377bfc112ed8cc4888192e7afdaa76c"

[build-dependencies]
glibc = { path = "../glibc" }
