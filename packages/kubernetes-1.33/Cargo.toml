[package]
# "." is not allowed in crate names, but we want a friendlier name for the
# directory and spec file, so we override it below.
name = "kubernetes-1_33"
version = "0.1.0"
edition = "2021"
publish = false
build = "../build.rs"

[lib]
path = "../packages.rs"

[package.metadata.build-package]
package-name = "kubernetes-1.33"

[[package.metadata.build-package.external-files]]
url = "https://distro.eks.amazonaws.com/kubernetes-1-33/releases/33/artifacts/kubernetes/v1.33.13/kubernetes-src.tar.gz"
sha512 = "bc31d85a2631801fbdb275483ef6b496ed4a78f9bbc6790b9645e7e0e72c6a5ff08af40d4d4ea638f2e393c4a1fd8ec7cbb59a483833a625d9cbf871181dbbec"

[build-dependencies]
glibc = { path = "../glibc" }
