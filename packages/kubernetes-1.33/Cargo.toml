[package]
# "." is not allowed in crate names, but we want a friendlier name for the
# directory and spec file, so we override it below.
name = "kubernetes-1_33"
version = "0.1.0"
edition = "2021"
publish = false
build = "../build.rs"

[lib]
path = "../packages.rs"

[package.metadata.build-package]
package-name = "kubernetes-1.33"

[[package.metadata.build-package.external-files]]
url = "https://distro.eks.amazonaws.com/kubernetes-1-33/releases/34/artifacts/kubernetes/v1.33.13/kubernetes-src.tar.gz"
sha512 = "eca28ef3021d92a40fdc64b7f301777f8068c584fd510368c406d8e6455dc2ea67afb7b736643125d5972bfcc4d1702761f2f83ca91e7a13618cefd7b4deb5f8"

[build-dependencies]
glibc = { path = "../glibc" }
