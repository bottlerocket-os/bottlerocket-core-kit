[package]
# "." is not allowed in crate names, but we want a friendlier name for the
# directory and spec file, so we override it below.
name = "kubernetes-1_33"
version = "0.1.0"
edition = "2021"
publish = false
build = "../build.rs"

[lib]
path = "../packages.rs"

[package.metadata.build-package]
package-name = "kubernetes-1.33"

[[package.metadata.build-package.external-files]]
url = "https://distro.eks.amazonaws.com/kubernetes-1-33/releases/31/artifacts/kubernetes/v1.33.13/kubernetes-src.tar.gz"
sha512 = "f839634e4ccb367a3629576093fa4c0b82f405bee8e48d443289ea63e0c4aa60ef606b1aaccb0ecb22c406f01d51468672eecba6079be15ebb34b15b6638025a"

[build-dependencies]
glibc = { path = "../glibc" }
