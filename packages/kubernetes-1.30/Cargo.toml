[package]
# "." is not allowed in crate names, but we want a friendlier name for the
# directory and spec file, so we override it below.
name = "kubernetes-1_30"
version = "0.1.0"
edition = "2021"
publish = false
build = "../build.rs"

[lib]
path = "../packages.rs"

[package.metadata.build-package]
package-name = "kubernetes-1.30"

[[package.metadata.build-package.external-files]]
url = "https://distro.eks.amazonaws.com/kubernetes-1-30/releases/47/artifacts/kubernetes/v1.30.14/kubernetes-src.tar.gz"
sha512 = "c2f4c8d7118cab6c9dd4bf30c2fa33d90e6fee97caf0694a14f940a4f7ef92d0470d456cac2d857ff60b471c09a91ea2aff9d6e53f61b1b4e7985e7ab8ef5dec"

[build-dependencies]
glibc = { path = "../glibc" }
