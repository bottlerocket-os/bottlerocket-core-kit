[package]
# "." is not allowed in crate names, but we want a friendlier name for the
# directory and spec file, so we override it below.
name = "kubernetes-1_32"
version = "0.1.0"
edition = "2021"
publish = false
build = "../build.rs"

[lib]
path = "../packages.rs"

[package.metadata.build-package]
package-name = "kubernetes-1.32"

[[package.metadata.build-package.external-files]]
url = "https://distro.eks.amazonaws.com/kubernetes-1-32/releases/43/artifacts/kubernetes/v1.32.13/kubernetes-src.tar.gz"
sha512 = "021dc937584b6dcfedcccaa88649dc82b3b53da9a443cac62d731d3ce0d42cc7816f8ac31e5efc1c96aedec1da103865b6547e548e87495c8cd20a3a2f9c923a"

[build-dependencies]
glibc = { path = "../glibc" }
