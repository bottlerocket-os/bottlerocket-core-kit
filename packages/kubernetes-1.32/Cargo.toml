[package]
# "." is not allowed in crate names, but we want a friendlier name for the
# directory and spec file, so we override it below.
name = "kubernetes-1_32"
version = "0.1.0"
edition = "2021"
publish = false
build = "../build.rs"

[lib]
path = "../packages.rs"

[package.metadata.build-package]
package-name = "kubernetes-1.32"

[[package.metadata.build-package.external-files]]
url = "https://distro.eks.amazonaws.com/kubernetes-1-32/releases/41/artifacts/kubernetes/v1.32.13/kubernetes-src.tar.gz"
sha512 = "5feb8c20f69c0e04a9a9f7e43e391a10cd11b9f67481bb9aa62cc0010401726f814fd6a9e5ebc56e4220aa3c08017b133218bf0aa035638fc117f65c32ccc9a0"

[build-dependencies]
glibc = { path = "../glibc" }
