[package]
# "." is not allowed in crate names, but we want a friendlier name for the
# directory and spec file, so we override it below.
name = "kubernetes-1_32"
version = "0.1.0"
edition = "2021"
publish = false
build = "../build.rs"

[lib]
path = "../packages.rs"

[package.metadata.build-package]
package-name = "kubernetes-1.32"

[[package.metadata.build-package.external-files]]
url = "https://distro.eks.amazonaws.com/kubernetes-1-32/releases/29/artifacts/kubernetes/v1.32.9/kubernetes-src.tar.gz"
sha512 = "d300660d8d98518dc62153025d0204c203189490b7a8fed2fad75759a0d262205be9f3352af2a093cb8f7f94a089e5fd329ea791ddfb7cf1a8a85329655ebf86"

[build-dependencies]
glibc = { path = "../glibc" }
