[package]
# "." is not allowed in crate names, but we want a friendlier name for the
# directory and spec file, so we override it below.
name = "kubernetes-1_32"
version = "0.1.0"
edition = "2021"
publish = false
build = "../build.rs"

[lib]
path = "../packages.rs"

[package.metadata.build-package]
package-name = "kubernetes-1.32"

[[package.metadata.build-package.external-files]]
url = "https://distro.eks.amazonaws.com/kubernetes-1-32/releases/44/artifacts/kubernetes/v1.32.13/kubernetes-src.tar.gz"
sha512 = "f773986b651223dd9bf217570974bea3051b6e56a33dfd1d588fa81f9fc4b6808cee9a20de9d588996889ded15fb85178de0024aea34488cdaf248d4d46e2a1a"

[build-dependencies]
glibc = { path = "../glibc" }
