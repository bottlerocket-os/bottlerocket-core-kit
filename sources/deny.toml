[licenses]
version = 2

# We want really high confidence when inferring licenses from text
confidence-threshold = 0.93

# Commented license types are allowed but not currently used
allow = [
    "Apache-2.0",
    # "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    # "CC0-1.0",
    "ISC",
    "MIT",
    "OpenSSL",
    "Unlicense",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0"
]

exceptions = [
    { name = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"], version = "*" },
]

# https://github.com/hsivonen/encoding_rs The non-test code that isn't generated from the WHATWG data in this crate is
# under Apache-2.0 OR MIT. Test code is under CC0.
[[licenses.clarify]]
name = "encoding_rs"
version = "0.8.30"
expression = "(Apache-2.0 OR MIT) AND BSD-3-Clause"
license-files = [{ path = "COPYRIGHT", hash = 0x39f8ad31 }]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
name = "webpki"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]

[bans]
# Deny multiple versions or wildcard dependencies.
multiple-versions = "deny"
wildcards = "deny"

deny = [{ name = "structopt" }, { name = "clap", wrappers = ["cargo-readme"] }]

skip = [
    # Older crates (gptman, handlebars, tungstenite) use thiserror 1.x while
    # newer crates (asn1-rs, x509-parser, cached) use thiserror 2.x
    { name = "thiserror", version = "=1" },
    { name = "thiserror-impl", version = "=1" },
    # aws-sigv4 uses sha1 0.11 while aws-config still uses sha1 0.10
    { name = "sha1", version = "=0.10" },
]
skip-tree = [
    # windows-sys is not a direct dependency. mio and schannel
    # are using different versions of windows-sys. we skip the
    # dependency tree because windows-sys has many sub-crates
    # that differ in major version.
    { name = "windows-sys" },
    # httptest uses an older version of bstr
    { name = "httptest", version = "=0.15" },
    # tough 0.24 uses reqwest 0.13 while the rest of the workspace uses 0.12
    { name = "tough", version = "=0.24" },
    # aws-smithy-http-client (local carry) brings newer TLS dependencies
    # that coexist with older versions in the aws-sdk dependency tree
    { name = "aws-smithy-http-client", version = "=1.2.0" },
    # actix-http has upgraded to v0.9 of 'rand' but upstream has called out some
    # breaking changes which will need to be explored for our first party code
    # https://rust-random.github.io/book/update-0.9.html
    { name = "rand", version = "=0.8" },
    # zbus introduces newer versions of crates that are either
    # incompatible or way ahead from the versions used in other crates
    { name = "zbus", version = "=5.14.0" },
    # aws-sigv4 upgraded to newer RustCrypto crates (hmac 0.13, sha2 0.11,
    # hashbrown 0.16, foldhash 0.2) while other deps still use older versions
    { name = "aws-sigv4" },
    # lru 0.16 uses hashbrown 0.16 / foldhash 0.2 while other deps use older versions
    { name = "lru" },
]

[bans.workspace-dependencies]
duplicates = "deny"
include-path-dependencies = true
unused = "allow"

[advisories]
# generational-arena is currently unmaintained.
ignore = [
    "RUSTSEC-2024-0014",
]

[sources]
# Deny crates from unknown registries or git repositories.
unknown-registry = "deny"
unknown-git = "deny"

allow-git = [
    # The settings SDK is currently provided as a git dependency,
    # We will allow it as an exception until the following is resolved:
    # https://github.com/bottlerocket-os/bottlerocket-settings-sdk/issues/18
    "https://github.com/bottlerocket-os/bottlerocket-settings-sdk",
]
